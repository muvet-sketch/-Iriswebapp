name: Respaldo Supabase (diario)

# Respalda la base de datos completa + todos los archivos de Storage, lo cifra
# con AES-256 y lo sube como artifact del run.
#
# El cifrado NO es opcional: este repositorio es PÚBLICO y los artifacts de un
# repo público son descargables por cualquiera. Sin GPG esto publicaría la
# historia clínica y los datos personales de los tutores.
#
# Efecto secundario útil: al conectarse todos los días, este workflow cuenta
# como actividad de la base y evita que Supabase pause el proyecto por
# inactividad (riesgo real del plan free).

on:
  schedule:
    # 07:10 UTC = 02:10 en Colombia (UTC-5). Minuto no redondo a propósito:
    # los cron en punto son los más congestionados en GitHub Actions y se
    # retrasan más.
    - cron: '10 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: respaldo-supabase
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://ayyggymsblvxrrzfjhmw.supabase.co' }}
      PGCONNECT_TIMEOUT: '30'

    steps:
      - uses: actions/checkout@v5

      - name: Verificar que los 3 secretos estén configurados
        run: |
          set -euo pipefail
          faltan=()
          [ -n "${SUPABASE_DB_URL:-}" ]           || faltan+=("SUPABASE_DB_URL")
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || faltan+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -n "${GPG_PASSPHRASE:-}" ]            || faltan+=("BACKUP_GPG_PASSPHRASE")
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "Faltan secretos del repositorio: ${faltan[*]}" >&2
            echo "Configúralos en Settings > Secrets and variables > Actions." >&2
            echo "Ver scripts/respaldo/README.md" >&2
            exit 1
          fi

      # El servidor es PostgreSQL 17.x y pg_dump se niega a volcar un servidor
      # más nuevo que él. ubuntu-latest trae el cliente 16, así que hay que
      # instalar el 17 desde el repositorio oficial de PostgreSQL.
      #
      # No basta con instalarlo: hay que poner /usr/lib/postgresql/17/bin
      # ADELANTE en el PATH. Si se deja que resuelva solo, `pg_dump` puede
      # seguir siendo el 16 que ya venía en la imagen, y el síntoma es
      # confuso — psql conecta sin problema (no valida versiones) y el
      # respaldo truena recién en el primer pg_dump.
      - name: Instalar cliente de PostgreSQL 17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          echo "pg_dump por defecto: $(command -v pg_dump) -> $(pg_dump --version)"
          echo "pg_dump 17 explícito: $(/usr/lib/postgresql/17/bin/pg_dump --version)"

      # El respaldo se arma en RUNNER_TEMP, fuera del árbol del repo, para que
      # no haya forma de que datos clínicos terminen en un commit.
      - name: Preparar carpeta del respaldo
        run: |
          set -euo pipefail
          sello="$(date -u +'%Y%m%d-%H%M')"
          dir="$RUNNER_TEMP/iris-respaldo-$sello"
          mkdir -p "$dir"
          echo "SELLO=$sello" >> "$GITHUB_ENV"
          echo "RESPALDO_DIR=$dir" >> "$GITHUB_ENV"

      - name: Volcar base de datos
        run: bash scripts/respaldo/dump-db.sh

      - name: Descargar archivos de Storage
        run: node scripts/respaldo/descargar-storage.mjs

      - name: Verificar el respaldo y escribir manifiesto
        run: node scripts/respaldo/verificar-respaldo.mjs

      - name: Empaquetar y cifrar (AES-256)
        run: |
          set -euo pipefail
          cd "$(dirname "$RESPALDO_DIR")"
          nombre="$(basename "$RESPALDO_DIR")"
          zip -q -r "$nombre.zip" "$nombre"
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --quiet \
            --symmetric --cipher-algo AES256 \
            --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            --passphrase-fd 0 --output "$nombre.zip.gpg" "$nombre.zip"
          # Se borra TODO lo que quedó en claro antes de subir nada.
          rm -f "$nombre.zip"
          rm -rf "$nombre"
          echo "ARCHIVO_CIFRADO=$PWD/$nombre.zip.gpg" >> "$GITHUB_ENV"
          echo "Cifrado: $(du -h "$nombre.zip.gpg" | cut -f1)"

      - name: Subir respaldo cifrado
        uses: actions/upload-artifact@v4
        with:
          name: iris-respaldo-${{ env.SELLO }}
          path: ${{ env.ARCHIVO_CIFRADO }}
          # Máximo del plan free. Para archivo de largo plazo hay que bajar una
          # copia cada tanto — ver scripts/respaldo/README.md.
          retention-days: 90
          if-no-files-found: error
          # Ya está comprimido y cifrado; recomprimir solo gasta tiempo.
          compression-level: 0
